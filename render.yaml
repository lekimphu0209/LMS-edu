# Render Blueprint — deploy LMS API (Postgres hosted on Supabase free, no expiry)
# Dashboard: New > Blueprint Instance > connect GitHub repo LMS-edu
# After apply, set env var DATABASE_URL = Supabase connection string (Session pooler URI)
services:
  - type: web
    name: educonnect-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "3000"
      - key: APP_URL
        value: https://educonnect-web-cyan.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ARGON2_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@educonnect.local
      - key: ADMIN_PASSWORD
        value: Admin@123
