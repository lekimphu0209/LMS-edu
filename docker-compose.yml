services:
  postgres:
    image: postgres:16-alpine
    container_name: educonnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educonnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EduConnect@2026}
      POSTGRES_DB: ${POSTGRES_DB:-educonnect}
    ports:
      - "8002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - educonnect-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: educonnect-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://educonnect:EduConnect@2026@postgres:5432/educonnect?schema=public
    ports:
      - "8001:3000"
    networks:
      - educonnect-net
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8001/api}
    container_name: educonnect-web
    restart: unless-stopped
    ports:
      - "8003:80"
    networks:
      - educonnect-net
    depends_on:
      - api

volumes:
  postgres_data:

networks:
  educonnect-net:
    driver: bridge
